permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recommendation_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: recommendation_test
        ports:
          - 5432:5432
        options: >-
          --memory=2304m --memory-swap=2304m
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Normal code serving and signed repair boundaries
        run: node --test tests/release-model-evaluation-input.test.cjs tests/normal-code-serving.test.cjs tests/code-data-release.test.cjs tests/staged-code-release.test.cjs tests/committed-generation-recovery-continuation.test.cjs
      - name: Authenticated immutable research archive reads
        run: node --test tests/research-archive-read.test.cjs tests/reviewed-analysis.test.cjs
      - name: Native PostgreSQL immutable research archive reads
        run: node scripts/verifyResearchArchivePostgres.cjs
        env:
          RESEARCH_ARCHIVE_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Immutable report archive storage and unknown commit recovery
        run: node --test tests/research-report-store.test.cjs tests/research-write-service.test.cjs tests/research-publication-retry.test.cjs tests/research-publication-input-recovery.test.cjs tests/research-archive-retry.test.cjs tests/research-write-http.test.cjs tests/research-http-routing.test.cjs tests/research-broker-client.test.cjs tests/research-broker-journal.test.cjs tests/research-revision-policy.test.cjs tests/research-reviewed-revision.test.cjs tests/research-broker-dependencies.test.cjs tests/research-broker-installer.test.cjs tests/research-installer-archive-contract.test.cjs
      - name: Kernel Unix socket peer identity in isolated Linux fixtures
        run: python3 scripts/verifyResearchSocketPeer.py
      - name: Independent review versions, frozen combo legs and refresh authority
        run: node --test tests/research-combo-revision.test.cjs tests/research-frozen-combos.test.cjs tests/research-review-projection.test.cjs tests/research-review-frontend.test.cjs tests/research-refresh-boundary.test.cjs
      - name: Frozen combo authority replay and original archive identity
        run: node --test tests/recommendation-authority.test.cjs tests/recommendation-authority-integration.test.cjs tests/research-frozen-combos.test.cjs
      - name: Exact r876 readonly baseline preparation and actual ancestor lock
        run: |
          node scripts/verifyReleaseWorkerPreflight.cjs
          node --test tests/baseline-authority-replay-repair.test.cjs
          node scripts/verifyReleaseVerifierContracts.cjs
          sudo "$(command -v node)" scripts/verifyBaselineAuthorityReplayLock.cjs
          sudo env CI=true BASELINE_PEER_FIXTURE=isolated "$(command -v node)" scripts/verifyBaselineReadonlyPeer.cjs
      - name: Root socket bounded frames and process boundary fixtures
        run: python3 scripts/verifyResearchSocketServer.py
      - name: Actual isolated installed-path Python binding and unsigned dependencies
        run: sudo /usr/bin/python3.12 -I -S -B scripts/verifyResearchSocketBinding.py
      - name: Native PostgreSQL bounded receipt reader queue and fresh snapshot
        run: node scripts/verifyReceiptBarrierPostgres.cjs
        env:
          RECEIPT_BARRIER_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Real Linux release-lock contention and child lifetime
        run: node scripts/verifyResearchReleaseLock.cjs
      - name: Real systemd privilege drop, zero child capabilities and inherited lock
        run: sudo env RESEARCH_ISOLATED_SYSTEMD_TEST=1 "$(command -v node)" scripts/verifyResearchRunuser.cjs
      - name: Explicit exact publication retry after a completed lock failure
        run: |
          node scripts/verifyResearchPublicationRetryPostgres.cjs
          node scripts/verifyResearchPublicationInputRecoveryPostgres.cjs
        env:
          RESEARCH_REPORT_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Explicit immutable report retry after a completed lock failure
        run: node scripts/verifyResearchArchiveRetryPostgres.cjs
        env:
          RESEARCH_REPORT_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Native PostgreSQL immutable report archive storage
        run: node scripts/verifyResearchReportPostgres.cjs
        env:
          RESEARCH_REPORT_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Native PostgreSQL signed review revision chain
        run: node scripts/verifyResearchRevisionPostgres.cjs
        env:
          RESEARCH_REPORT_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Native PostgreSQL immutable two and three leg review chains
        run: node scripts/verifyResearchComboRevisionPostgres.cjs
        env:
          RESEARCH_REPORT_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Controlled native release and rollback contracts
        run: node scripts/verifyReleaseArchivePreflight.cjs && node scripts/verifyReleaseWindowPreflight.cjs && node scripts/verifyReleaseStoragePreflight.cjs && node scripts/verifyNativeReleasePipeline.cjs && node scripts/verifyNativeReleaseJournal.cjs && node scripts/verifyNativeReleaseRecovery.cjs && node scripts/verifyReleaseArchiveSuccessorContracts.cjs
      - run: node scripts/verifyProductionPlanSourceContracts.cjs
      - run: node --test tests/football-data-lower-league-history.test.cjs tests/postgres-team-history.test.cjs
      - run: node --test tests/postgres-model-input-paging.test.cjs
      - run: node --test tests/reconcile-history-admission.test.cjs
      - run: node --test tests/postgres-reference-admission.test.cjs
      - run: node --test tests/postgres-file-json-payload.test.cjs tests/streamed-public-reference-archive.test.cjs tests/reference-index-repair-boundary.test.cjs tests/reference-index-release-gate.test.cjs tests/generation-startup-streaming.test.cjs
      - run: node --test tests/postgres-reference-repair-policy.test.cjs tests/postgres-reference-repair-recovery.test.cjs
      - run: node scripts/verifyPublicReferencePairs.cjs && node scripts/verifyReferencePairedBaseline.cjs
      - run: node scripts/verifyFastResultGenerationReconciliation.cjs
      - run: node scripts/verifyHistoricalEventStore.cjs && node scripts/verifyFootballDataResultsSync.cjs
      - run: node --test tests/baseline-ensemble-policy.test.cjs tests/recommendation-supplementary-research.test.cjs tests/recommendation-independent-markets.test.cjs
      - run: node scripts/verifyJointGoalFit.cjs
      - run: node --test tests/recommendation-official-results.test.cjs tests/recommendation-frozen-had-candidates.test.cjs tests/national-team-history-aliases.test.cjs
      - run: node --test tests/candidate-retired-settlement.test.cjs
      - run: node scripts/verifyCandidateProspectiveLedger.cjs
      - run: node scripts/verifyCandidateReleaseContinuity.cjs
      - run: node scripts/verifyWalkForwardValidation.cjs && node --test tests/matchday-walk-forward.test.cjs
      - run: node --test tests/recommendation-live-official-handicap.test.cjs tests/recommendation-coherent-primary.test.cjs tests/recommendation-unified.test.cjs tests/recommendation-center-view.test.cjs tests/recommendation-combo-availability.test.cjs tests/recommendation-warehouse-sp.test.cjs tests/recommendation-warehouse-sp-view.test.cjs tests/recommendation-live-market.test.cjs tests/recommendation-handicap-margin.test.cjs tests/recommendation-mixed-combo.test.cjs tests/recommendation-quality-report.test.cjs tests/recommendation-had-direction.test.cjs
      - run: node --test tests/data-coverage.test.cjs tests/market-comparison.test.cjs tests/recommendation-review-page.test.cjs tests/recommendation-review-frontend.test.cjs tests/recommendation-dual-research.test.cjs tests/recommendation-schema-bridge.test.cjs
      - run: node --test tests/market-collector-policy.test.cjs tests/market-store.test.cjs tests/market-signal-bridge.test.cjs tests/market-http.test.cjs tests/market-features.test.cjs tests/market-quote-refresh.test.cjs
      - run: node --test tests/recommendation-render-clock.test.cjs tests/recommendation-center-interaction.test.cjs tests/recommendation-match-parity.test.cjs tests/recommendation-detail-consistency.test.cjs tests/recommendation-input-evidence.test.cjs tests/recommendation-published-score-distribution.test.cjs tests/recommendation-selection-quality.test.cjs tests/recommendation-entry-flow.test.cjs tests/navbar-interaction.test.cjs
      - run: node scripts/verifyRecommendationSelectionRisk.cjs && node scripts/verifyRecommendationCrossTrackRuntime.cjs
      - run: node --test tests/team-badge.test.cjs tests/team-badge-assets.test.cjs tests/match-display-team.test.cjs
      - run: node --test tests/accounts*.test.cjs tests/account-frontend.test.cjs tests/account-admin.test.cjs tests/public-product.test.cjs tests/public-browse-flow.test.cjs
      - run: node --test tests/prematch*.test.cjs tests/api-football-scoped-coverage.test.cjs collectors/leisu-prematch/website-reader.test.cjs collectors/leisu-prematch/api-football-reference.test.cjs collectors/leisu-prematch/local-jingcai-scope.test.cjs
      - run: node scripts/verifyApiFootballHardening.cjs && node scripts/verifyTeamCategoryIdentity.cjs
      - run: node scripts/verifyPrematchPriorityPostgres.cjs
        env:
          PREMATCH_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: 'Native PostgreSQL accounts: scripts/verifyAccountsPostgres.cjs'
        run: node scripts/verifyAccountsPostgres.cjs
        env:
          ACCOUNTS_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/verifyUnifiedRecommendationPostgres.cjs
        env:
          UNIFIED_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/verifyWarehouseSpPostgres.cjs
        env:
          UNIFIED_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/postgresTeamHistoryVerify.cjs
        env:
          TEAM_HISTORY_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node tests/postgres-generation-native.integration.cjs
        env:
          POSTGRES_GENERATION_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Owned native worker read isolation and unchanged deadlines
        run: node --test tests/postgres-worker-read-process.test.cjs && node scripts/verifySyncWorkerCadence.cjs && node --max-old-space-size=128 scripts/verifyPostgresWorkerReadIsolation.cjs
        env:
          WORKER_READ_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Bounded PostgreSQL source assembly with real 512 MiB original bytes
        run: node --max-old-space-size=256 tests/postgres-source-memory.integration.cjs
        env:
          POSTGRES_SOURCE_MEMORY_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
          POSTGRES_SOURCE_MEMORY_CONTAINER: ${{ job.services.postgres.id }}
