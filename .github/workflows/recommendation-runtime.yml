name: Recommendation runtime checks
on:
  pull_request:
    paths:
      - 'scripts/recommendationPlatform/**'
      - 'collectors/market/**'
      - 'src/services/warehouseLotterySp.cjs'
      - 'src/services/publishedForecastPolicy.cjs'
      - 'src/services/prospectiveForecastInput.cjs'
      - 'src/services/handicapMarginDecision.cjs'
      - 'src/services/handicapCalibration.cjs'
      - 'scripts/dailyFeaturedComboLedger.cjs'
      - 'scripts/verifyUnifiedRecommendationPostgres.cjs'
      - 'scripts/verifyWarehouseSpPostgres.cjs'
      - 'server/postgres/migrations/011_unified_recommendation_runtime.sql'
      - 'src/components/recommendations/**'
      - 'src/hooks/useRecommendationCenter.ts'
      - 'src/services/recommendationCenterView.ts'
      - 'src/pages/BestTips.tsx'
      - 'src/pages/BetSlipGenerator.tsx'
      - 'src/pages/HitAndWin.tsx'
      - 'tests/recommendation*.cjs'
      - 'tests/navbar-interaction.test.cjs'
      - 'src/components/Navbar.tsx'
      - 'src/components/Footer.tsx'
      - 'src/styles/**'
      - 'src/pages/PredictionsList.tsx'
      - 'src/components/predictions/**'
      - '.github/workflows/recommendation-runtime.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recommendation_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: recommendation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/recommendation-unified.test.cjs tests/recommendation-center-view.test.cjs tests/recommendation-combo-availability.test.cjs tests/recommendation-warehouse-sp.test.cjs tests/recommendation-warehouse-sp-view.test.cjs tests/recommendation-live-market.test.cjs tests/recommendation-handicap-margin.test.cjs tests/recommendation-mixed-combo.test.cjs tests/recommendation-quality-report.test.cjs
      - run: node --test tests/market-collector-policy.test.cjs tests/market-store.test.cjs tests/market-signal-bridge.test.cjs tests/market-http.test.cjs tests/market-features.test.cjs
      - run: node --test tests/recommendation-render-clock.test.cjs tests/recommendation-center-interaction.test.cjs tests/navbar-interaction.test.cjs
      - run: node scripts/verifyUnifiedRecommendationPostgres.cjs
        env:
          UNIFIED_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/verifyWarehouseSpPostgres.cjs
        env:
          UNIFIED_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: npm run build
