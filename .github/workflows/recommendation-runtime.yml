name: Recommendation runtime checks
on:
  pull_request:
    paths:
      - 'server/accounts.cjs'
      - 'server/publicProduct.cjs'
      - 'server/index.cjs'
      - 'server/recommendationReviewPage.cjs'
      - 'server/prematchRefresh.cjs'
      - 'collectors/leisu-prematch/**'
      - 'scripts/*Prematch*.cjs'
      - 'scripts/*Football*.cjs'
      - 'scripts/syncData.cjs'
      - 'scripts/walkForwardValidation.cjs'
      - 'scripts/runModelBacktest.cjs'
      - 'tests/matchday-walk-forward.test.cjs'
      - 'scripts/historicalEventStore.cjs'
      - 'scripts/postgresTeamHistory*.cjs'
      - 'scripts/reconcileFastResultGeneration.cjs'
      - 'server/referencePairedBaseline.cjs'
      - 'server/streamedJsonObjectArrays.cjs'
      - 'scripts/postgresGenerationSource.cjs'
      - 'scripts/postgresModelInput.cjs'
      - 'tests/postgres-model-input-paging.test.cjs'
      - 'tests/postgres-reference-admission.test.cjs'
      - 'tests/postgres-generation-native.integration.cjs'
      - 'tests/reconcile-history-admission.test.cjs'
      - 'tests/football-data-lower-league-history.test.cjs'
      - 'tests/postgres-team-history*.test.cjs'
      - 'scripts/teamCategoryIdentity.cjs'
      - 'scripts/entityResolutionRegistry.cjs'
      - 'tests/prematch*.test.cjs'
      - 'tests/api-football-scoped-coverage.test.cjs'
      - 'deploy/light-server/football-daily-prematch.*'
      - 'deploy/light-server/recommendation-schema-bridge.cjs'
      - 'deploy/light-server/release-native.sh'
      - 'deploy/light-server/football-release-recovery.cjs'
      - 'deploy/light-server/native-release-policy.json'
      - 'scripts/nativeRelease*.cjs'
      - 'scripts/verifyReleaseArchiveSuccessor*.cjs'
      - 'scripts/releaseArchivePreflight.cjs'
      - 'scripts/verifyReleaseArchivePreflight.cjs'
      - 'scripts/data/archive-successor-lineage.json'
      - 'scripts/data/frozen-archive-restoration.json'
      - 'scripts/verifyNativeRelease*.cjs'
      - 'scripts/releaseStoragePreflight.cjs'
      - 'scripts/verifyReleaseStoragePreflight.cjs'
      - 'scripts/runReleaseWindowPreflight.cjs'
      - 'scripts/verifyReleaseWindowPreflight.cjs'
      - 'scripts/validateNativeReleasePolicy.cjs'
      - 'scripts/createReleaseBundle.cjs'
      - 'scripts/frontendRuntimeBoundary.cjs'
      - 'scripts/verifyFrontendRuntimeBoundary.cjs'
      - 'scripts/verifyFrontendEvidenceSemantics.cjs'
      - 'scripts/verifyReleaseBundleSafety.cjs'
      - 'scripts/verifyPostgresMigrationPlan.cjs'
      - 'server/postgres/migrations/012_accounts_and_follows.sql'
      - 'scripts/verifyAccountsPostgres.cjs'
      - 'scripts/bootstrapAccountAdmin.cjs'
      - 'src/App.tsx'
      - 'src/**'
      - 'src/context/**'
      - 'src/pages/Auth.tsx'
      - 'src/pages/Account.tsx'
      - 'src/pages/AccountAdmin.tsx'
      - 'src/pages/Following.tsx'
      - 'src/pages/PublicBrowse.tsx'
      - 'src/services/accountApi.ts'
      - 'src/components/FollowButton.tsx'
      - 'tests/accounts*.test.cjs'
      - 'tests/account*.test.cjs'
      - 'tests/public-product.test.cjs'
      - 'tests/public-browse-flow.test.cjs'
      - 'scripts/recommendationPlatform/**'
      - 'server/postgres/migrations/013_dual_choice_research.sql'
      - 'scripts/dataCoverage.cjs'
      - 'scripts/freeFootballTeamAliases.cjs'
      - 'collectors/market/**'
      - 'src/services/warehouseLotterySp.cjs'
      - 'src/services/publishedForecastPolicy.cjs'
      - 'src/services/prospectiveForecastInput.cjs'
      - 'src/services/recommendationInputEvidence.cjs'
      - 'src/services/recommendationSelectionQuality.cjs'
      - 'src/services/publishedScoreDistribution.cjs'
      - 'src/services/supplementaryResearch.cjs'
      - 'src/services/baselineEnsemblePolicy.cjs'
      - 'src/services/modelInputUsage.cjs'
      - 'tests/baseline-ensemble-policy.test.cjs'
      - 'tests/recommendation-supplementary-research.test.cjs'
      - 'src/services/handicapMarginDecision.cjs'
      - 'src/services/handicapCalibration.cjs'
      - 'scripts/dailyFeaturedComboLedger.cjs'
      - 'scripts/verifyUnifiedRecommendationPostgres.cjs'
      - 'scripts/verifyWarehouseSpPostgres.cjs'
      - 'server/postgres/migrations/011_unified_recommendation_runtime.sql'
      - 'src/components/recommendations/**'
      - 'src/hooks/useRecommendationCenter.ts'
      - 'src/hooks/useRecommendationReviewPage.ts'
      - 'src/services/recommendationCenterView.ts'
      - 'src/services/recommendationReviewPage.ts'
      - 'src/services/marketComparison.ts'
      - 'src/pages/BestTips.tsx'
      - 'src/pages/BetSlipGenerator.tsx'
      - 'src/pages/HitAndWin.tsx'
      - 'tests/recommendation*.cjs'
      - 'scripts/verifyUnifiedRecommendationPostgres.cjs'
      - 'tests/data-coverage.test.cjs'
      - 'tests/market-comparison.test.cjs'
      - 'tests/navbar-interaction.test.cjs'
      - 'src/components/Navbar.tsx'
      - 'src/components/Footer.tsx'
      - 'src/styles/**'
      - 'src/pages/PredictionsList.tsx'
      - 'src/pages/MatchDetail.tsx'
      - 'src/services/publishedMatchRecommendation.ts'
      - 'src/services/publishedDetailPresentation.ts'
      - 'scripts/sync500Data.cjs'
      - 'scripts/runMarketCollector.cjs'
      - 'src/components/predictions/**'
      - 'src/components/TeamBadge.tsx'
      - 'src/services/teamVisuals.ts'
      - 'src/services/teamBadgeAssets.ts'
      - 'src/services/teamCrestCatalog.json'
      - 'src/services/displayRecommendation.ts'
      - 'src/assets/team-badges/**'
      - 'scripts/cacheTeamBadgeAssets.cjs'
      - 'tests/team-badge*.test.cjs'
      - 'tests/match-display-team.test.cjs'
      - '.github/workflows/recommendation-runtime.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recommendation_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: recommendation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Controlled native release and rollback contracts
        run: node scripts/verifyReleaseArchivePreflight.cjs && node scripts/verifyReleaseWindowPreflight.cjs && node scripts/verifyReleaseStoragePreflight.cjs && node scripts/verifyNativeReleasePipeline.cjs && node scripts/verifyNativeReleaseJournal.cjs && node scripts/verifyNativeReleaseRecovery.cjs && node scripts/verifyReleaseArchiveSuccessorContracts.cjs
      - run: node scripts/verifyProductionPlanSourceContracts.cjs
      - run: node --test tests/football-data-lower-league-history.test.cjs tests/postgres-team-history.test.cjs
      - run: node --test tests/postgres-model-input-paging.test.cjs
      - run: node --test tests/reconcile-history-admission.test.cjs
      - run: node --test tests/postgres-reference-admission.test.cjs
      - run: node scripts/verifyPublicReferencePairs.cjs && node scripts/verifyReferencePairedBaseline.cjs
      - run: node scripts/verifyFastResultGenerationReconciliation.cjs
      - run: node scripts/verifyHistoricalEventStore.cjs && node scripts/verifyFootballDataResultsSync.cjs
      - run: node --test tests/baseline-ensemble-policy.test.cjs tests/recommendation-supplementary-research.test.cjs
      - run: node scripts/verifyWalkForwardValidation.cjs && node --test tests/matchday-walk-forward.test.cjs
      - run: node --test tests/recommendation-unified.test.cjs tests/recommendation-center-view.test.cjs tests/recommendation-combo-availability.test.cjs tests/recommendation-warehouse-sp.test.cjs tests/recommendation-warehouse-sp-view.test.cjs tests/recommendation-live-market.test.cjs tests/recommendation-handicap-margin.test.cjs tests/recommendation-mixed-combo.test.cjs tests/recommendation-quality-report.test.cjs
      - run: node --test tests/data-coverage.test.cjs tests/market-comparison.test.cjs tests/recommendation-review-page.test.cjs tests/recommendation-review-frontend.test.cjs tests/recommendation-dual-research.test.cjs tests/recommendation-schema-bridge.test.cjs
      - run: node --test tests/market-collector-policy.test.cjs tests/market-store.test.cjs tests/market-signal-bridge.test.cjs tests/market-http.test.cjs tests/market-features.test.cjs tests/market-quote-refresh.test.cjs
      - run: node --test tests/recommendation-render-clock.test.cjs tests/recommendation-center-interaction.test.cjs tests/recommendation-match-parity.test.cjs tests/recommendation-detail-consistency.test.cjs tests/recommendation-input-evidence.test.cjs tests/recommendation-published-score-distribution.test.cjs tests/recommendation-selection-quality.test.cjs tests/recommendation-entry-flow.test.cjs tests/navbar-interaction.test.cjs
      - run: node scripts/verifyRecommendationSelectionRisk.cjs && node scripts/verifyRecommendationCrossTrackRuntime.cjs
      - run: node --test tests/team-badge.test.cjs tests/team-badge-assets.test.cjs tests/match-display-team.test.cjs
      - run: node --test tests/accounts*.test.cjs tests/account-frontend.test.cjs tests/account-admin.test.cjs tests/public-product.test.cjs tests/public-browse-flow.test.cjs
      - run: node --test tests/prematch*.test.cjs tests/api-football-scoped-coverage.test.cjs collectors/leisu-prematch/website-reader.test.cjs collectors/leisu-prematch/api-football-reference.test.cjs collectors/leisu-prematch/local-jingcai-scope.test.cjs
      - run: node scripts/verifyApiFootballHardening.cjs && node scripts/verifyTeamCategoryIdentity.cjs
      - run: node scripts/verifyPrematchPriorityPostgres.cjs
        env:
          PREMATCH_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: 'Native PostgreSQL accounts: scripts/verifyAccountsPostgres.cjs'
        run: node scripts/verifyAccountsPostgres.cjs
        env:
          ACCOUNTS_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/verifyUnifiedRecommendationPostgres.cjs
        env:
          UNIFIED_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/verifyWarehouseSpPostgres.cjs
        env:
          UNIFIED_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node scripts/postgresTeamHistoryVerify.cjs
        env:
          TEAM_HISTORY_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - run: node tests/postgres-generation-native.integration.cjs
        env:
          POSTGRES_GENERATION_TEST_DATABASE_URL: postgresql://recommendation_test:local_test_only@127.0.0.1:5432/recommendation_test
      - name: Frontend evidence semantics
        run: node scripts/verifyFrontendEvidenceSemantics.cjs
      - name: Frontend runtime boundary
        run: node scripts/verifyFrontendRuntimeBoundary.cjs
      - run: npm run build
