name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prediction Data
        run: npm run validate:data

      - name: Verify Pages API Base
        env:
          DATA_API_BASE: ${{ vars.DATA_API_BASE }}
        run: |
          if [ -z "${DATA_API_BASE:-}" ]; then
            echo "DATA_API_BASE repository variable is required for protected C-end Pages builds."
            exit 1
          fi
          case "$DATA_API_BASE" in
            https://*) ;;
            *)
              echo "DATA_API_BASE must be an absolute HTTPS URL, got: $DATA_API_BASE"
              exit 1
              ;;
          esac

      - name: Build Project
        env:
          VITE_BASE_PATH: /football-predict/
          VITE_DATA_API_BASE: ${{ vars.DATA_API_BASE }}
        run: npm run build

      - name: Prepare SPA Fallback
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
