root /opt/football-predict/dist;

client_max_body_size 2m;
# The upstream is loopback.  Bound connection failover tightly so a stopped
# release process reaches the truthful Nginx maintenance backend in at most
# one connect timeout, and re-probe the primary after one second.
proxy_connect_timeout 1s;
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 2s;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
limit_req_status 429;

include /etc/nginx/snippets/football-predict-security-headers.conf;

location = /data/runtime-config.json {
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Cache-Control;
  expires off;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  add_header Cache-Control "no-store" always;
}

location /assets/ {
  try_files $uri =404;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  # Do not attach immutable caching to 404/5xx responses. Without `always`,
  # Nginx emits this only for successful/cacheable statuses.
  add_header Cache-Control "public, max-age=31536000, immutable";
  access_log off;
}

location /media/ {
  try_files $uri =404;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  add_header Cache-Control "public, max-age=604800";
  access_log off;
}

location = /contact-qr-code.jpg {
  try_files $uri =404;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  add_header Cache-Control "public, max-age=3600";
  access_log off;
}

location = /contact-qr.jpg {
  try_files $uri =404;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  add_header Cache-Control "public, max-age=3600";
  access_log off;
}

# These legacy root payloads are protected API data, not SPA routes. Returning
# 410 here prevents the static fallback below from disguising them as index.html
# while the Node service is paused during a release cutover.
location = /matches.json {
  return 410;
}

location = /odds-history.json {
  return 410;
}

# Do not turn common source/config probes into a misleading SPA 200 response.
# The ACME challenge location is declared with ^~ by the site config and wins
# before this regex is considered.
location ~ (^|/)\. {
  return 404;
}

location ~* ^/(?:package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|vite\.config\.[^/]+|tsconfig(?:\.[^/]+)?\.json)$ {
  return 404;
}

location /data/ {
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_hide_header Cache-Control;
  expires off;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  add_header Cache-Control "no-store" always;
  limit_req zone=football_api burst=160 nodelay;
}

location /api/v1/events {
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 90s;
  proxy_send_timeout 90s;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=football_api burst=160 nodelay;
  limit_conn football_sse 5;
  access_log off;
}

location = /api/admin/sporttery-relay-snapshot {
  client_max_body_size 32m;
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=football_admin burst=5 nodelay;
}

location = /api/admin/sporttery-relay-fast-lane {
  client_max_body_size 8m;
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=football_admin burst=5 nodelay;
}

location = /api/admin/sporttery-collector-evidence {
  client_max_body_size 8m;
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=football_admin burst=5 nodelay;
}

location /api/admin/ {
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=football_admin burst=5 nodelay;
}

location /api/ {
  proxy_pass http://football_node;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  limit_req zone=football_api burst=300 nodelay;
}

location / {
  # The SPA is a built artifact, so serve it without depending on the Node
  # upstream. Protected data remains behind the /api/ and /data/ locations.
  # This also keeps route refreshes available while a signed release briefly
  # pauses the application service for the atomic SQLite/tree handoff.
  try_files $uri $uri/ /index.html;
  expires off;
  include /etc/nginx/snippets/football-predict-security-headers.conf;
  add_header Cache-Control "no-store" always;
}
