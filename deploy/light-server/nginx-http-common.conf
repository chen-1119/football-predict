server_tokens off;

limit_req_zone $binary_remote_addr zone=football_api:10m rate=120r/s;
limit_req_zone $binary_remote_addr zone=football_admin:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=football_sse:10m;

upstream football_node {
  # The release transaction must stop the Node process while it takes the
  # rollback snapshot and projects the new immutable generation into SQLite.
  # A local Nginx-only backup keeps that intentional maintenance window from
  # escaping as a misleading 502/connection reset.  Application-produced 5xx
  # responses are not intercepted: the backup is selected only when the
  # primary transport cannot be reached.
  server 127.0.0.1:8788 max_fails=1 fail_timeout=1s;
  server 127.0.0.1:8787 backup;
  keepalive 64;
}

# Loopback-only, constant-memory release fallback.  This server never serves
# predictions or synthetic data; it reports a retryable 503 until the primary
# Node listener is healthy again.
server {
  listen 127.0.0.1:8787;
  server_name football_release_maintenance;
  access_log off;

  location / {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "2" always;
    add_header X-Football-Service-State "release-maintenance" always;
    return 503 '{"ok":false,"error":"service restarting","code":"RELEASE_MAINTENANCE","retryable":true,"retryAfterSeconds":2}\n';
  }
}
